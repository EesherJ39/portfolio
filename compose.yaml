name: eesher-portfolio

services:
  web:
    build:
      context: .
      target: runtime
    image: eesher-portfolio:local
    container_name: eesher-portfolio
    restart: unless-stopped
    init: true
    ports:
      - "23601:3000"
    environment:
      NODE_ENV: production
      WRANGLER_SEND_METRICS: "false"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
